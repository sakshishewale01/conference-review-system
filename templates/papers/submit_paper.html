{% extends "base.html" %}

{% block content %}

<div style="max-width:800px;margin:auto;">

<div class="card">

<h1 style="
font-family:'Playfair Display',serif;
margin-bottom:12px;
">
Submit Research Paper
</h1>

<p style="
color:var(--muted);
margin-bottom:35px;
">
Upload your conference paper with abstract and keywords.
</p>

<form method="POST" enctype="multipart/form-data">

<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

<div class="form-group">

<label>Paper Title</label>

<input
type="text"
name="title"
placeholder="Enter paper title"
required>

</div>



<div class="form-group">

<label>Abstract</label>

<textarea
name="abstract"
rows="6"
placeholder="Enter abstract"
required></textarea>

</div>



<div class="form-group">

<label>Keywords</label>

<input
type="text"
name="keywords"
placeholder="AI, ML, DBMS..."
required>

</div>



<div class="form-group">

<label>Upload PDF</label>

<input
type="file"
name="paper_file"
accept=".pdf"
required>

</div>



<button
type="submit"
class="btn btn-gold">

Submit Paper

</button>

</form>

</div>

</div>

{% endblock %}
